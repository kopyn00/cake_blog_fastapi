name: Cake Blog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cake_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest -v
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cake_blog_test
          SECRET_KEY: ci-test-secret-key
          S3_BUCKET_NAME: cake-blog-test
          S3_ACCESS_KEY_ID: testing
          S3_SECRET_ACCESS_KEY: testing
          S3_REGION: eu-north-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: eu-north-1

  build:
    name: Build and publish ARM64 image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/kopyn00/cake_blog_fastapi:latest
            ghcr.io/kopyn00/cake_blog_fastapi:${{ github.sha }}

  deploy:
    name: Deploy to Raspberry Pi
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          test -f "$HOME/docker/cake-blog/.env"
          test -d "$HOME/docker/cake-blog"

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username kopyn00 \
            --password-stdin

          cp docker-compose.yaml "$HOME/docker/cake-blog/docker-compose.yaml"

          cd "$HOME/docker/cake-blog"

          docker compose pull

          docker compose run --rm --no-deps app alembic upgrade head

          docker compose up -d --remove-orphans

          docker compose ps
